
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix - Film Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎬 MovieFlix</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
            <a href="#recommend">Recommendations</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <h2>Discover Your Next Favourite Movie</h2>
            <p>Find amazing movies based on your interests.</p>
            <a href="#movies" class="hero-btn">Explore Movies</a>
        </div>
    </section>

    <section class="search-section" id="movies">
        <h2>Explore Movies</h2>

        <input type="text" id="searchInput"
            placeholder="Search movies...">

        <select id="genreFilter">
            <option value="All">All Genres</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
            <option value="Comedy">Comedy</option>
            <option value="Thriller">Thriller</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
        </select>

        <div class="movie-container" id="movieContainer">
        </div>
    </section>

    <section class="recommend-section" id="recommend">
        <h2>Get Movie Recommendations</h2>
        <p>Select your favourite genre.</p>

        <select id="recommendGenre">
            <option value="">Choose a genre</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
            <option value="Comedy">Comedy</option>
            <option value="Thriller">Thriller</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
        </select>

        <button onclick="recommendMovies()">
            Recommend Movies
        </button>

        <div class="movie-container" id="recommendContainer">
        </div>
    </section>

    <footer>
        <p>© 2026 MovieFlix | Film Recommendation System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
